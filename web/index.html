<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B3A27">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CQA · Freedom Broker</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#/">
      <img src="assets/logo.svg" alt="" width="34" height="34">
      <span class="brand-text"><b>FREEDOM</b><small>BROKER</small></span>
      <span class="brand-sep"></span>
      <span class="brand-cqa">CQA</span>
    </a>
    <nav class="nav" id="nav"></nav>
    <button class="dataset-pill" id="datasetPill" type="button"></button>
  </aside>

  <main class="main" id="main">
    <div class="hero"></div>
    <header class="topbar" id="topbar">
      <a class="brand" href="#/">
        <img src="assets/logo.svg" alt="" width="30" height="30">
        <span class="brand-text"><b>FREEDOM</b><small>BROKER</small></span>
        <span class="brand-sep"></span>
        <span class="brand-cqa">CQA</span>
      </a>
      <button class="ds-chip" id="datasetChip" type="button"></button>
    </header>
    <div id="view"></div>
  </main>

  <nav class="tabbar" id="tabbar"></nav>

  <div id="dock"></div>
  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
